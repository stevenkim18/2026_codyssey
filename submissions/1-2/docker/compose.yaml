services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: codyssey/agent-leak-app:arm64
    platform: linux/arm64
    ports:
      - "15034:15034"
    environment:
      AGENT_HOME: /opt/agent
      AGENT_PORT: "15034"
      AGENT_UPLOAD_DIR: /opt/agent/upload_files
      AGENT_KEY_PATH: /opt/agent/api_keys
      AGENT_LOG_DIR: /var/log/agent-app
      MEMORY_LIMIT: "${MEMORY_LIMIT:-512}"
      CPU_MAX_OCCUPY: "${CPU_MAX_OCCUPY:-10}"
      MULTI_THREAD_ENABLE: "${MULTI_THREAD_ENABLE:-false}"
    init: true
    mem_limit: 1g
    restart: "no"
